 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 30px;
            width: 200px;
            background-color:  cornflowerblue;
            animation: ikka 3s  infinite;
        }
        @keyframes ikka{
            from{
                transform:translateY(0);
            }
            to{
                transform: translateY(900%);
            }
        }
    </style>
 </head>
 <body>
    <h1>key frame</h1>
    <div class="box">HELLO HOW ARE YOU!</div>
    
 </body>
 </html>
