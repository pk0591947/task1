<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(red,green,blue);
        }
        @media(max-width:1100px){
            body{
                background: linear-gradient(lightblue,lightgreen,lightpink);
            }
        }
        @media(max-width:900px){
            body{
                background: linear-gradient(brown,green,violet);
            }
        }
        @media(max-width:700px){
            body{
                background: radial-gradient(green,lightgreen,red);
            }
        }
        @media(max-width:400px){
            body{
                background: conic-gradient(blue,green,lightblue);
            }
        }
    </style>
    
</head>
<body>
    <h1>Media Querry</h1>

</body>
</html>
