<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    h2{
        border-style: solid;
        border-color: gray ;
        border-width: thick;
        border-radius: 30px;
        border-right-style: dotted;
        border-top-color: brown;
        border-top-left-radius: 40px;
        background-color: aquamarine;
    }


    h3{
     outline-style: solid;
     outline-width: thick;
     outline-color: darkgrey;
     outline-offset: 5px;

    }
</style>
</head>
<body>
    <h2>Hello bro </h2>
    <h3>outline bawa</h3>
</body>
</html>
