<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bg {
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSH701YiK1jAlgjnmS6bfRsg8gPX-VisZmEXA5twaSNNA&s=10);
            height: 710px;
            width: 100%;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        .nav {
            color: azure;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px;
        }

        ol {
            display: flex;
            list-style: none;
            gap: 30px;
            margin: 10px;

        }
        .headi{
            color:darksalmon;
            font-size: larger;
            margin: 50px;
        }
        span{
            color: blue;
        }
        
            
        
        button{
            box-shadow: 5px 5px 3px 3px white;
            color: blue;
            background-color: transparent;
            margin: 300px 100px 100px 0px;

        }
    </style>
</head>

<body>
    <div class="bg">
        <div class="nav">
            <h1>Broadband</h1>
            <ol>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Place</li>
                <li>Drop</li>
                <li>Contact</li>
            </ol>

        </div>
        <div class="headi">
            <h2>Best <span>Broadband</span></h2>
            <h3>Internet Plans For You</h3>
            <p>Broadband is high-speed internet access that uses wide-bandwidth data transmission to stay constantly
                "on" and run much faster than traditional dial-up</p>
                   <button>View more</button>
        </div>
     

    </div>
    
</body>

</html>
