<!DOCTYPE html>

<head>

        }

            margin: 250px 250px 300px 800px;

        }

            <li>
                <select style="color: brown;background-color: transparent;border: transparent;">
                    <option >Pages</option>

                </select>
                
                

            </li>

        </ul>
        </div>
