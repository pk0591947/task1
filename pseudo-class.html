<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p:first-child{
            color: blue;
        }
        p:last-child{
            color: blueviolet;
        }
        p:nth-child(2){
            color: brown;
        }
    </style>
</head>
<body>
    <div>
        <p>apple</p>
        <p>mango</p>
        <p>grapes</p>
        <p>banana</p>
    </div>
</body>
</html>
