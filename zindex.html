<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            position: absolute;
            color: white;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
            font-size: 20px;
            
        }
        .box1{
            background-color: red;
            top:100px;
            left:50px;
            z-index: 10;
        }
        .box2{
              background-color:blue;
            top:150px;
            left:60px;
            z-index: 40;
            
        }
        .box3{  background-color: green;
            top:200px;
            left:80px;
            z-index: 200;}
    </style>
</head>
<body>
    <h1>Z index</h1>
    <div class="box box1">red</div>
      <div class="box box2">blue</div>
        <div class="box box3">green</div>
</body>
</html>
